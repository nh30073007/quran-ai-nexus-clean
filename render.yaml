# ==========================================
# RENDER.COM DEPLOYMENT CONFIGURATION
# Place this file in the root directory
# ==========================================

services:
  - type: web
    name: quran-ai-nexus
    runtime: python
    repo: https://github.com/YOUR_USERNAME/quran_ai_nexus
    plan: starter
    region: singapore
    
    # Build Command - Runs from root
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python -c "from app.agents.tafsir_agent import TafsirAgent; TafsirAgent()"
      python -c "from app.services.embeddings import QuranEmbeddingService; QuranEmbeddingService()"
    
    # Start Command - Runs from root
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    # Environment Variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      
      - key: SECRET_KEY
        generateValue: true
      
      - key: JWT_ALGORITHM
        value: HS256
      
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      
      - key: ADMIN_USERNAME
        value: admin
      
      - key: ADMIN_PASSWORD
        sync: false
        description: "Set a strong admin password in Render dashboard"
      
      - key: ENVIRONMENT
        value: production
      
      - key: DEBUG
        value: false
      
      - key: LOG_LEVEL
        value: INFO
      
      - key: PORT
        value: 8000
      
      - key: HF_TOKEN
        sync: false
        description: "Hugging Face token for faster model downloads (optional)"
      
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.com,https://yourdomain.com
        description: "Add your frontend URLs here"
    
    # Health Check
    healthCheckPath: /health
    
    # Auto-Deploy
    autoDeploy: true
    
    # Build Filter
    buildFilter:
      paths:
        - backend/**
        - render.yaml
        - .render-build.sh

  # Optional: Background Worker for heavy tasks
  # - type: worker
  #   name: quran-ai-worker
  #   runtime: python
  #   buildCommand: cd backend && pip install -r requirements.txt
  #   startCommand: cd backend && python worker.py